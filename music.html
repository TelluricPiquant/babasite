</head>
<body>

<header>

</header>

<nav>
  <a href="photos.html">Photos</a>
  <a href="videos.html">Videos</a>

<section id="music">
  <h2>Music</h2>
  <div id="music-list">
    <p class="empty">Loading…</p>
  </div>
</section>

<!-- HOW TO ADD A TITLE: the file name becomes the track title automatically. Add " -- caption text" after the name for a subtitle. -->

<script src="script.js"></script>
<script>
  async function renderMusic(){
    const list = document.getElementById("music-list");
    const files = await listFolder("music");
    const tracks = files.filter(f => /\.(mp3|wav|m4a|ogg)$/i.test(f.name));
    if(tracks.length === 0){
      list.innerHTML = '<p class="empty">No tracks yet.</p>';
      return;
    }
    list.innerHTML = tracks.map(f => {
      const { title, caption } = parseMusicName(f.name);
      return `
        <div class="track">
          <div class="title">${title}</div>
          ${caption ? `<div class="caption">${caption}</div>` : ""}
          <audio controls src="${RAW_BASE}music/${encodeURIComponent(f.name)}"></audio>
        </div>
      `;
    }).join("");
  }
  renderMusic();
</script>

</body>
</html>
