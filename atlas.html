<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atlas — Baba</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
  :root{
    --parchment:#F5F0E6; --ink:#241F1A; --ink-soft:#5c554c; --line:#ddd3c0;
    --veg:#1E7B3C; --fungi:#7A6C8F; --fruit:#D95F0E; --legume:#00806F; --grain:#C8861B; --nut:#8F4A0A;
    --meat:#B81830; --dairy:#2D7DD2; --other:#8E24AA; --fat:#FFD23F;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--parchment);color:var(--ink);font-family:'Inter',sans-serif;overflow:hidden;}
  #siteHeader{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 18px;padding:12px 18px 10px;background:var(--parchment);flex-shrink:0;}
  #siteTitle{font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:600;font-size:19px;margin:0;letter-spacing:-0.01em;}
  #siteTitle a{color:var(--ink);text-decoration:none;}
  #siteNav{display:flex;gap:1.1rem;flex-wrap:wrap;}
  #siteNav a{text-decoration:none;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);padding-bottom:3px;border-bottom:2px solid transparent;}
  #siteNav a:hover, #siteNav a.active{color:var(--ink);border-color:var(--fruit);}
  #app{position:relative;height:100vh;width:100vw;display:flex;flex-direction:column;}
  header{padding:14px 18px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--parchment) 80%,transparent);z-index:10;flex-shrink:0;}
    .atlasTitle{font-family:'Fraunces',serif;font-optical-sizing:auto;font-weight:600;font-size:20px;margin:0 0 2px 0;letter-spacing:0.2px;}
  .sub{font-size:11.5px;color:var(--ink-soft);letter-spacing:0.3px;}
  #breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px;font-size:12px;color:var(--ink-soft);}
  #catNote{margin-top:4px;font-size:12.5px;font-style:italic;color:var(--ink-soft);min-height:16px;}
  @media (min-width:900px){
    .atlasTitle{font-size:32px;}
    header .sub{font-size:16px;}
    #breadcrumb{font-size:15px;}
    #catNote{font-size:16px;}
  }
  #breadcrumb span{cursor:pointer;padding:2px 4px;}
  #breadcrumb span.current{color:var(--ink);font-weight:600;cursor:default;}
  #breadcrumb span:not(.current):hover{text-decoration:underline;}
  #breadcrumb .sep{color:var(--line);}
  #canvasWrap{flex:1;position:relative;overflow:hidden;}
  svg{width:100%;height:100%;display:block;}
  circle{cursor:pointer;}
  text.label{font-family:'Space Grotesk',sans-serif;fill:#fff;text-anchor:middle;pointer-events:none;font-weight:700;letter-spacing:0.01em;text-shadow:0 1px 4px rgba(0,0,0,0.45);}
  #hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink-soft);pointer-events:none;opacity:0.85;}

  #sheet{position:fixed;left:0;right:0;bottom:0;background:#fffdf8;border-top:2px solid var(--ink);border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform 0.32s cubic-bezier(.2,.8,.25,1);max-height:82vh;overflow-y:auto;z-index:50;box-shadow:0 -8px 30px rgba(0,0,0,0.25);}
  #sheet.open{transform:translateY(0);}
  #sheetHandle{width:38px;height:4px;background:var(--line);border-radius:3px;margin:10px auto 4px;}
  #sheetInner{padding:6px 22px 40px;}
  #sheetClose{position:absolute;top:12px;right:16px;width:28px;height:28px;border-radius:50%;background:var(--parchment);border:1px solid var(--line);font-size:15px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .sheet-eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-top:6px;}
  #sheetInner h2{font-family:'Fraunces',serif;font-size:26px;font-weight:700;margin:2px 0 10px 0;}
  .origin{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;font-style:italic;}

  /* score meter */
  .score-wrap{margin:2px 0 16px;}
  .score-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
  .score-cap{font-size:11px;font-weight:700;letter-spacing:0.7px;text-transform:uppercase;color:var(--ink-soft);}
  .score-num{font-family:'Fraunces',serif;font-weight:700;font-size:22px;}
  .meter{position:relative;height:12px;border-radius:7px;background:linear-gradient(90deg,#b23b2e 0%,#c05f2c 22%,#c98a2e 42%,#9aa63c 62%,#5a9c4e 80%,#2f7d4f 100%);overflow:visible;}
  .meter-marker{position:absolute;top:-4px;width:4px;height:20px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px #fffdf8;transform:translateX(-50%);}
  .score-legend{font-size:10.5px;color:var(--ink-soft);display:flex;justify-content:space-between;margin-top:5px;}
  .score-note{font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.45;}

  /* factor chips */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 2px;}
  .chip{font-size:11.5px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:#faf5ea;color:var(--ink);display:inline-flex;gap:5px;align-items:center;}
  .chip b{font-weight:600;}
  .chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  #flagRow{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 0;}
  .flag-pill{font-size:12px;font-weight:600;letter-spacing:0.2px;padding:5px 11px;border-radius:20px;background:#efe3cf;color:#7a3b1d;border:1px solid #e0cdab;cursor:pointer;user-select:none;}
  .flag-pill.on{background:#7a3b1d;color:#fff;border-color:#7a3b1d;}
  .flag-pill.clean{background:#e4ede2;color:#3f6b4c;border-color:#cfe0cd;cursor:default;}
  #flagWhy{background:#faf4e8;border:1px solid var(--line);border-radius:12px;padding:0 14px;max-height:0;overflow:hidden;transition:max-height 0.3s ease,padding 0.3s ease,margin 0.3s ease;margin:0;}
  #flagWhy.open{padding:13px 14px;margin:10px 0 0;max-height:800px;}
  #flagWhy .why-label{font-size:11px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:#7a3b1d;margin-bottom:3px;}
  #flagWhy .fix-label{font-size:11px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:#3f6b4c;margin:11px 0 3px;}
  #flagWhy p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink);}

  .block{margin-top:18px;}
  .block-label{font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:4px;}
  .block-label.good{color:var(--veg);}
  .block-label.watch{color:var(--meat);}
  .block p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink);}

  #overlay{position:fixed;inset:0;background:rgba(36,31,26,0.35);opacity:0;pointer-events:none;transition:opacity 0.32s;z-index:40;}
  #overlay.open{opacity:1;pointer-events:auto;}
</style>

<script>
const DATA = {"name": "Whole Foods", "children": [{"name": "Vegetables", "color": "--veg", "children": [{"name": "Root Vegetables", "children": [{"name": "Carrot", "good": "Rich in beta-carotene, converted to vitamin A. Decent fiber and potassium.", "watch": "Fairly high glycemic load if eaten in large amounts cooked and pureed.", "origin": "Domesticated in Central Asia (modern Afghanistan), originally purple, bred orange in the Netherlands."}, {"name": "Beet", "good": "High in nitrates (supports blood flow), folate, manganese.", "watch": "High oxalate content, relevant for kidney stone formers.", "origin": "Mediterranean coastal plant, cultivated since antiquity for its greens before the root."}, {"name": "Potato", "good": "Very high potassium, resistant starch when cooked and cooled, vitamin C.", "watch": "High glycemic index when hot; green-tinted skin contains solanine, a toxin.", "origin": "Andes mountains of Peru and Bolivia, domesticated over 7,000 years ago."}, {"name": "Sweet Potato", "good": "Extremely high beta-carotene, fiber, potassium.", "watch": "Oxalates present, moderate glycemic load.", "origin": "Central or South America, one of the oldest cultivated vegetables."}, {"name": "Turnip", "good": "Low calorie, decent vitamin C, root and greens both edible.", "watch": "Contains goitrogens that can affect thyroid function in very large amounts.", "origin": "Cultivated in Europe and Asia for over 4,000 years."}, {"name": "Radish", "good": "Very low calorie, contains sulfur compounds with antimicrobial properties.", "watch": "Goitrogenic in large quantities.", "origin": "Southeast Asia, spread to Egypt and Europe in antiquity."}, {"name": "Parsnip", "good": "Higher fiber than carrot, good source of folate and vitamin C.", "watch": "Sap can cause skin irritation in sunlight (phytophotodermatitis) when harvesting.", "origin": "Mediterranean and Eurasia, used by Romans before sugar was widespread."}, {"name": "Rutabaga", "good": "Good potassium and vitamin C, low calorie density.", "watch": "Cruciferous goitrogen content, similar to turnip.", "origin": "A cross between cabbage and turnip, first recorded in 17th century Scandinavia."}, {"name": "Jicama", "good": "Very high water content, good fiber, low calorie.", "watch": "Skin and stems are toxic (contain rotenone), only the root is eaten.", "origin": "Mexico and Central America."}, {"name": "Cassava", "good": "Very calorie dense root, major starch staple for hundreds of millions of people.", "watch": "Contains cyanogenic glycosides; must be properly processed (soaked, cooked) or it's toxic.", "origin": "South America, a staple crop across the tropics today."}]}, {"name": "Leafy Greens", "children": [{"name": "Spinach", "good": "Very high in vitamin K, iron, magnesium, folate.", "watch": "One of the highest oxalate vegetables, limits usable calcium and iron for some people.", "origin": "Persia (modern Iran), spread through the Islamic world into Europe."}, {"name": "Kale", "good": "High vitamin K, C, and calcium relative to other greens.", "watch": "Goitrogenic; contains thiocyanates that can interfere with iodine uptake.", "origin": "Eastern Mediterranean and Asia Minor, an ancient wild cabbage relative."}, {"name": "Romaine Lettuce", "good": "High water content, some vitamin A and K.", "watch": "Low nutrient density overall relative to volume.", "origin": "Ancient Egypt, cultivated for its seeds before becoming a leaf crop."}, {"name": "Arugula", "good": "Good source of nitrates and vitamin K, peppery glucosinolates.", "watch": "Mild goitrogen content, generally minor.", "origin": "Mediterranean region."}, {"name": "Swiss Chard", "good": "High in vitamin K, magnesium, potassium.", "watch": "Very high oxalate content, among the highest of common greens.", "origin": "Sicily, a beet relative grown for its leaves."}, {"name": "Collard Greens", "good": "High calcium bioavailability among greens, vitamin K and A.", "watch": "Some goitrogen content, moderate.", "origin": "Eastern Mediterranean, a non-heading cabbage."}, {"name": "Cabbage", "good": "Cheap source of vitamin C and K, contains sulforaphane precursors.", "watch": "Can cause bloating (raffinose sugars); goitrogenic raw in large amounts.", "origin": "Europe, bred from wild Brassica oleracea."}, {"name": "Watercress", "good": "One of the most nutrient-dense greens by volume, high in vitamin K and antioxidants.", "watch": "Low goitrogen risk relative to other cruciferous greens.", "origin": "Europe and Asia, grown in flowing water since antiquity."}, {"name": "Bok Choy", "good": "Good calcium and vitamin C, milder goitrogen load than kale.", "watch": "Still cruciferous, moderate goitrogens if eaten raw in bulk.", "origin": "China, cultivated for over 5,000 years."}]}, {"name": "Cruciferous", "children": [{"name": "Broccoli", "good": "High sulforaphane content, associated with detoxification enzyme support. Good vitamin C and K.", "watch": "Goitrogenic, can cause gas from raffinose.", "origin": "Northern Mediterranean, bred from wild cabbage by the Etruscans."}, {"name": "Cauliflower", "good": "Low calorie, decent vitamin C, versatile low-carb substitute.", "watch": "Goitrogenic and can cause bloating.", "origin": "Northeast Mediterranean, related to broccoli and cabbage."}, {"name": "Brussels Sprouts", "good": "Very high vitamin K and C for their size, high sulforaphane.", "watch": "Strongly goitrogenic and gas-producing raw or undercooked.", "origin": "Belgium, 16th century, from the wild cabbage family."}, {"name": "Kohlrabi", "good": "High vitamin C, low calorie, mild flavor.", "watch": "Mild goitrogen content.", "origin": "Northern Europe, a stem-swelling cabbage cultivar."}]}, {"name": "Alliums", "children": [{"name": "Onion", "good": "High in quercetin, a strong antioxidant flavonoid, and prebiotic fiber.", "watch": "High FODMAP content, can cause digestive discomfort for sensitive individuals.", "origin": "Central Asia, one of the oldest cultivated vegetables."}, {"name": "Garlic", "good": "Allicin compound has antimicrobial and cardiovascular benefits.", "watch": "High FODMAP, can cause GI upset in large raw quantities.", "origin": "Central Asia, used medicinally since ancient Egypt."}, {"name": "Leek", "good": "Milder allium benefits, good vitamin K and folate.", "watch": "Lower FODMAP than onion, generally well tolerated.", "origin": "Mediterranean and Near East."}, {"name": "Shallot", "good": "Concentrated allium flavonoids, more so than onion by weight.", "watch": "High FODMAP.", "origin": "Central or Southeast Asia."}, {"name": "Scallion", "good": "Milder flavonoid content, entire plant (white and green) is edible.", "watch": "Lower FODMAP, easier to tolerate than bulb onions.", "origin": "Asia, an immature or non-bulbing onion variety."}, {"name": "Chive", "good": "Small amounts of allicin, vitamin K.", "watch": "Minimal, usually used in tiny quantities.", "origin": "Europe, Asia, and North America."}]}, {"name": "Nightshades", "children": [{"name": "Tomato", "good": "High lycopene (more bioavailable cooked), vitamin C.", "watch": "Contains solanine and tomatine, alkaloids some people react to; unripe/green tomatoes higher in these.", "origin": "Western South America, domesticated in Mexico."}, {"name": "Bell Pepper", "good": "Extremely high vitamin C, more than citrus by weight.", "watch": "Low alkaloid load compared to other nightshades.", "origin": "Central and South America."}, {"name": "Eggplant", "good": "Good source of fiber and antioxidant anthocyanins in the skin.", "watch": "Contains solanine, higher than tomato or pepper.", "origin": "India, domesticated over 4,000 years ago."}, {"name": "Chili Pepper", "good": "Capsaicin has metabolic and anti-inflammatory effects.", "watch": "Alkaloid family member, can irritate sensitive digestive systems.", "origin": "Central and South America."}]}, {"name": "Squash & Gourds", "children": [{"name": "Zucchini", "good": "Very high water content, mild micronutrients, low calorie.", "watch": "Low overall nutrient density.", "origin": "Central America, though the modern zucchini cultivar was developed in Italy."}, {"name": "Butternut Squash", "good": "High beta-carotene and potassium, denser nutrition than summer squash.", "watch": "Higher carb load than other squash.", "origin": "Central America."}, {"name": "Acorn Squash", "good": "Good fiber, potassium, vitamin C.", "watch": "Moderate carb density.", "origin": "North America."}, {"name": "Pumpkin", "good": "Very high beta-carotene, decent fiber.", "watch": "Seeds (pepitas) are more nutrient-dense than the flesh.", "origin": "North America, one of the oldest domesticated plants in the Americas."}, {"name": "Cucumber", "good": "Extremely high water content, mild silica and vitamin K.", "watch": "Very low nutrient density per calorie.", "origin": "India, cultivated for at least 3,000 years."}]}, {"name": "Stalks & Stems", "children": [{"name": "Celery", "good": "Very low calorie, source of nitrates and vitamin K.", "watch": "Low nutrient density, mostly water and fiber.", "origin": "Mediterranean and Middle East, originally used medicinally."}, {"name": "Asparagus", "good": "Good folate, vitamin K, and prebiotic inulin fiber.", "watch": "Contains asparagusic acid, harmless but causes distinct urine odor.", "origin": "Eastern Mediterranean and Asia Minor."}, {"name": "Fennel", "good": "Good vitamin C and fiber, anethole compound aids digestion.", "watch": "Minimal downsides at normal intake.", "origin": "Mediterranean."}, {"name": "Rhubarb", "good": "Low calorie, source of vitamin K.", "watch": "Leaves are toxic (high oxalic acid); stalks also contain oxalates.", "origin": "Central Asia and Siberia, originally used as medicine, not food."}, {"name": "Artichoke", "good": "One of the highest-fiber vegetables, very high in the prebiotic inulin and the antioxidant cynarin.", "watch": "Inulin is a FODMAP, can cause gas in sensitive guts.", "origin": "Mediterranean, a cultivated thistle."}]}]}, {"name": "Fruits", "color": "--fruit", "children": [{"name": "Berries", "children": [{"name": "Blueberry", "good": "Extremely high in anthocyanins, associated with strong antioxidant activity.", "watch": "Low fiber relative to other berries by volume.", "origin": "North America, native wild shrub."}, {"name": "Raspberry", "good": "One of the highest-fiber fruits, good vitamin C.", "watch": "Minimal downsides.", "origin": "Europe and northern Asia."}, {"name": "Blackberry", "good": "High fiber and anthocyanins, good vitamin K.", "watch": "Minimal downsides.", "origin": "Widespread across temperate regions of the world."}, {"name": "Cranberry", "good": "High in proanthocyanidins, linked to urinary tract health.", "watch": "Very tart, almost always consumed with added sugar in juice or dried form.", "origin": "North American wetlands."}]}, {"name": "Citrus", "children": [{"name": "Orange", "good": "High vitamin C and flavonoids like hesperidin.", "watch": "Fairly high sugar content by fruit standards.", "origin": "Southeast Asia, a hybrid of pomelo and mandarin."}, {"name": "Lemon", "good": "Very high vitamin C, low sugar, citric acid.", "watch": "Acidic, can erode tooth enamel with frequent direct contact.", "origin": "Northeast India / China, spread via the Middle East."}, {"name": "Lime", "good": "High vitamin C, low sugar.", "watch": "Same acid-erosion consideration as lemon.", "origin": "Southeast Asia."}, {"name": "Grapefruit", "good": "High vitamin C, contains naringin antioxidant.", "watch": "Interacts with numerous medications by inhibiting liver enzymes.", "origin": "Barbados, an 18th century hybrid of pomelo and sweet orange."}, {"name": "Mandarin", "good": "High vitamin C, easier to digest sugars than orange for some.", "watch": "High sugar density relative to size.", "origin": "Southeast Asia and China."}]}, {"name": "Pomes", "children": [{"name": "Apple", "good": "Good fiber (pectin), polyphenols concentrated in the skin.", "watch": "Seeds contain trace amygdalin (cyanide precursor), harmless unless chewed in bulk.", "origin": "Central Asia (modern Kazakhstan), wild ancestor Malus sieversii."}, {"name": "Pear", "good": "High fiber, good potassium.", "watch": "Minimal downsides.", "origin": "Western Asia and Europe."}]}, {"name": "Stone Fruits", "children": [{"name": "Peach", "good": "Good vitamin C and A, moderate fiber.", "watch": "Fuzzy skin can trigger oral allergy symptoms in some pollen-allergic people.", "origin": "China, cultivated for over 4,000 years."}, {"name": "Plum", "good": "Good vitamin C and K, dried form (prune) is a strong natural laxative.", "watch": "Minimal downsides fresh.", "origin": "China and Caucasus region."}, {"name": "Cherry", "good": "High anthocyanins, tart cherry specifically linked to reduced inflammation markers.", "watch": "Pits contain amygdalin, toxic if crushed and eaten in quantity.", "origin": "Western Asia and Southeast Europe."}, {"name": "Apricot", "good": "High beta-carotene, good potassium.", "watch": "Kernels are toxic (cyanide precursor), only the flesh should be eaten.", "origin": "Central Asia, likely near modern day Armenia."}, {"name": "Nectarine", "good": "Nearly identical profile to peach, slightly higher sugar.", "watch": "Same pollen cross-reactivity as peach.", "origin": "China, a smooth-skinned peach mutation."}]}, {"name": "Tropical Fruits", "children": [{"name": "Banana", "good": "Very high potassium, resistant starch when slightly green.", "watch": "High glycemic load when fully ripe.", "origin": "Southeast Asia, domesticated over 7,000 years ago."}, {"name": "Pineapple", "good": "Contains bromelain, an enzyme with anti-inflammatory and digestive properties.", "watch": "High acidity can irritate the mouth with heavy consumption.", "origin": "South America, spread through the Caribbean before European contact."}, {"name": "Papaya", "good": "Very high vitamin C and A, contains papain, a digestive enzyme.", "watch": "Unripe papaya contains latex compounds that can trigger uterine contractions, a pregnancy caution.", "origin": "Southern Mexico and Central America."}, {"name": "Mango", "good": "High vitamin A and C, good fiber.", "watch": "High sugar density, and the skin can trigger contact reactions in people allergic to poison ivy (related plant family).", "origin": "South Asia, cultivated over 4,000 years."}, {"name": "Kiwi", "good": "Extremely high vitamin C, more than most citrus by weight.", "watch": "Common allergen, causes oral itching in sensitive individuals.", "origin": "China, commercialized in New Zealand in the 20th century."}, {"name": "Guava", "good": "Among the highest vitamin C content of any fruit, high fiber.", "watch": "Small edible seeds can be tough to digest for some.", "origin": "Central America."}, {"name": "Passionfruit", "good": "High fiber and vitamin C, good source of antioxidant polyphenols.", "watch": "Minimal downsides.", "origin": "South America."}]}, {"name": "Melons", "children": [{"name": "Watermelon", "good": "Very high water content, source of citrulline and lycopene.", "watch": "High glycemic index despite low calorie density.", "origin": "Northeast Africa."}, {"name": "Cantaloupe", "good": "High beta-carotene and vitamin C.", "watch": "High glycemic index.", "origin": "Persia and Africa."}, {"name": "Honeydew", "good": "Good hydration and potassium.", "watch": "Lower micronutrient density than cantaloupe.", "origin": "Africa and the Middle East."}]}, {"name": "Other Fruits", "children": [{"name": "Strawberry", "good": "Very high vitamin C, high in anthocyanin antioxidants.", "watch": "Botanically an accessory fruit, not a true berry. Noticeably lower polyphenol density than dark berries like blueberry or blackberry.", "origin": "Modern strawberry bred in 18th century France from a North American and a Chilean species."}, {"name": "Grape", "good": "Contains resveratrol, an antioxidant concentrated in the skin.", "watch": "High sugar density, very easy to overeat.", "origin": "Near the Caspian Sea in Western Asia."}, {"name": "Fig", "good": "High fiber and calcium for a fruit, good potassium.", "watch": "Very high sugar when dried.", "origin": "Western Asia, one of the first cultivated plants in human history."}, {"name": "Pomegranate", "good": "Extremely high polyphenol antioxidant content, especially punicalagins.", "watch": "Tedious to eat, juice versions often high in added sugar.", "origin": "Iran and the Himalayas."}, {"name": "Avocado", "good": "Fruit composed mostly of unsaturated fat. Contains potassium and fiber.", "watch": "Very calorie dense, easy to overconsume.", "origin": "South-central Mexico."}, {"name": "Date", "good": "Good source of potassium and fiber, natural sweetener.", "watch": "Extremely high sugar density, among the highest of any whole fruit.", "origin": "Middle East, cultivated for over 6,000 years."}, {"name": "Coconut", "good": "High in medium-chain triglycerides (MCTs), which are metabolized differently than most fats.", "watch": "Very high in saturated fat, though a distinct type from animal saturated fat.", "origin": "Indo-Pacific region."}, {"name": "Olives", "good": "Whole-food source of the same monounsaturated fat as olive oil, plus polyphenols the oil loses in processing.", "watch": "Always brine-cured, so sodium is high. Inedible raw.", "origin": "Eastern Mediterranean, cultivated for at least 6,000 years."}, {"name": "Persimmon", "good": "Very high beta-carotene, good fiber and vitamin C when ripe.", "watch": "Unripe astringent varieties are high in tannins that can upset the stomach; eat fully ripe.", "origin": "China, cultivated for over 2,000 years."}]}]}, {"name": "Legumes", "color": "--legume", "children": [{"name": "Black Beans", "good": "High fiber and plant protein, good folate and magnesium.", "watch": "Contains lectins and phytic acid, both reduced significantly by soaking and cooking.", "origin": "Peru, cultivated for over 7,000 years."}, {"name": "Chickpeas", "good": "Good plant protein and fiber, versatile.", "watch": "Phytic acid can reduce mineral absorption if undercooked.", "origin": "Southeastern Turkey."}, {"name": "Lentils", "good": "High protein and iron for a plant food, quick-cooking.", "watch": "Lower lectin activity than kidney beans, but still present raw.", "origin": "Near East, one of the earliest domesticated crops."}, {"name": "Kidney Beans", "good": "High fiber and protein.", "watch": "Contains phytohaemagglutinin, a lectin that is toxic if beans are undercooked; must be boiled thoroughly.", "origin": "Central America."}, {"name": "Pinto Beans", "good": "Good fiber, protein, and potassium.", "watch": "Same lectin and phytate considerations as other beans, reduced by cooking.", "origin": "Mexico and southwestern United States."}, {"name": "Peanuts", "good": "Technically a legume. Contains protein and resveratrol.", "watch": "Meaningfully high omega-6 despite the monounsaturated fat. Contains lectins and phytic acid. Common major allergen, and carries aflatoxin contamination risk (a mold toxin) if improperly stored.", "origin": "South America."}, {"name": "Soybeans / Edamame", "good": "Complete plant protein, isoflavones with some studied cardiovascular benefits.", "watch": "Very high omega-6, plus high lectins and phytic acid raw. High phytoestrogen content is debated. Most heavily genetically modified crop globally, and soybean oil is a major source of excess omega-6 in the modern diet.", "origin": "East Asia."}, {"name": "Green Peas", "good": "Decent plant protein and fiber for a vegetable-style legume.", "watch": "Moderate lectin and phytic acid content raw, both reduced by cooking. Relatively low omega-6 compared to other legumes.", "origin": "Near East and Mediterranean."}, {"name": "Lima Beans", "good": "Good fiber, potassium, and plant protein.", "watch": "Raw lima beans contain cyanogenic compounds, must be cooked thoroughly.", "origin": "Peru."}]}, {"name": "Grains", "color": "--grain", "children": [{"name": "Wheat", "good": "Source of calories and some B vitamins, primarily in whole grain form.", "watch": "Contains gluten, high omega-6 relative to omega-3, phytic acid binds minerals unless properly fermented.", "origin": "Fertile Crescent, one of the founding crops of agriculture."}, {"name": "White Rice", "good": "Easily digestible energy source, low in antinutrients and low in omega-6 since the bran (which holds the phytic acid and most of the fat) is removed.", "watch": "Low fiber and micronutrient content after milling. High glycemic load.", "origin": "China, domesticated roughly 9,000 years ago."}, {"name": "Brown Rice", "good": "More fiber and minerals than white rice, since the bran layer remains.", "watch": "Higher phytic acid and arsenic accumulation than white rice, since arsenic concentrates in the bran.", "origin": "Same origin as white rice, unmilled version."}, {"name": "Oats", "good": "High in beta-glucan fiber, linked to cholesterol reduction.", "watch": "High omega-6 content, frequently cross-contaminated with gluten during processing.", "origin": "Near East and Europe."}, {"name": "Corn", "good": "Decent energy source, contains lutein and zeaxanthin (support eye health).", "watch": "Very high omega-6, low protein quality, mostly consumed as refined products.", "origin": "Southern Mexico, domesticated from wild teosinte grass."}, {"name": "Barley", "good": "High in beta-glucan fiber similar to oats.", "watch": "Contains gluten, high phytic acid unless soaked or fermented, and skewed toward omega-6 like most grains.", "origin": "Fertile Crescent."}, {"name": "Rye", "good": "More fiber and minerals than wheat by weight.", "watch": "Contains gluten, phytic acid, and is omega-6 skewed like other grains. Susceptible to ergot fungus contamination historically, which is toxic.", "origin": "Southwest Asia and Eastern Europe."}]}, {"name": "Nuts & Seeds", "color": "--nut", "children": [{"name": "Almonds", "good": "High vitamin E and magnesium.", "watch": "Worst antinutrient load of common nuts: the highest phytic acid (roughly 1,200 mg per ounce, which binds zinc, iron, calcium, magnesium), plus high lectins and very high oxalates. Fairly high omega-6. Soaking or sprouting cuts the phytate meaningfully.", "origin": "Iran and surrounding regions."}, {"name": "Walnuts", "good": "Highest plant-based omega-3 (ALA) of common nuts, low in lectins.", "watch": "High phytic acid (around 860 mg per ounce). Very high total polyunsaturated fat, so despite the ALA the overall omega-6 to omega-3 ratio is still unfavorable, and that PUFA oxidizes easily with heat or storage.", "origin": "Persia (Iran)."}, {"name": "Cashews", "good": "Good magnesium and zinc, creamy texture used often in dairy-free products.", "watch": "High phytic acid (around 650 mg per ounce), high lectins, and high oxalates. High omega-6 and higher carbohydrate content than most nuts. Never sold truly raw, since the true raw shell contains a caustic irritant.", "origin": "Northeastern Brazil."}, {"name": "Pecans", "good": "Highest antioxidant content among common tree nuts. Low in lectins.", "watch": "Moderate to high phytic acid (around 665 mg per ounce) and high oxalates. High omega-6 and very calorie dense.", "origin": "Southern United States and Mexico."}, {"name": "Macadamia", "good": "Lowest omega-6 of any common nut. Lowest phytic acid (around 346 mg per ounce) and low lectins. Fat is mostly monounsaturated rather than saturated.", "watch": "Extremely calorie dense. Genuinely few antinutrient downsides, which is unusual for a nut.", "origin": "Australia."}, {"name": "Pistachios", "good": "Second-lowest phytic acid of common nuts (around 390 mg per ounce), low lectins, highest protein and potassium among nuts, good lutein.", "watch": "Moderately high omega-6 (most of its polyunsaturated fat is omega-6). Aflatoxin contamination risk if improperly stored, common allergen.", "origin": "Central Asia and the Middle East."}, {"name": "Brazil Nuts", "good": "Extraordinarily high in selenium, a single nut can cover a full day's requirement.", "watch": "High phytic acid (around 828 mg per ounce) and high omega-6 polyunsaturated fat. Easy to overconsume selenium to toxic levels eating several a day regularly.", "origin": "Amazon rainforest."}, {"name": "Chia Seeds", "good": "High fiber and plant omega-3 (ALA), good calcium, low in lectins. One of the few seeds where omega-3 dominates over omega-6.", "watch": "Very high phytic acid. Gel-forming fiber can be constipating without enough water.", "origin": "Central America, an Aztec and Mayan staple."}, {"name": "Flaxseeds", "good": "Highest plant ALA omega-3 content of any common seed, so omega-3 outweighs omega-6 here, and low in lectins.", "watch": "High phytic acid. Must be ground to be digestible, and contains cyanogenic compounds in small amounts. The oil goes rancid fast once ground.", "origin": "Near East, one of the oldest cultivated crops."}, {"name": "Sunflower Seeds", "good": "High vitamin E and selenium.", "watch": "Very high omega-6, among the most skewed of common seeds, and high in lectins plus meaningful phytic acid. One of the worst choices for an omega-6-conscious diet.", "origin": "North America."}, {"name": "Pumpkin Seeds", "good": "High magnesium and zinc, decent plant protein, low in lectins.", "watch": "High omega-6 (most of its polyunsaturated fat) and moderate phytic acid.", "origin": "Central America."}, {"name": "Sesame Seeds", "good": "Very high calcium for a plant food, good copper and manganese.", "watch": "High omega-6, high phytic acid, very high oxalates (among the highest of any seed), and high in lectins. Common allergen.", "origin": "India and East Africa, one of the oldest oilseed crops."}]}, {"name": "Meat", "color": "--meat", "children": [{"name": "Red Meat", "children": [{"name": "Beef (grass-fed)", "good": "Better omega-3 to omega-6 ratio and more CLA (conjugated linoleic acid) than grain-fed. Complete protein, high B12, zinc, iron.", "watch": "More expensive, cooking to well-done or charring increases carcinogenic compounds (HCAs, PAHs).", "origin": "Domesticated from wild aurochs in the Fertile Crescent and Indus Valley roughly 10,000 years ago."}, {"name": "Beef (grain-finished)", "good": "Same base nutrient profile as grass-fed, higher marbling and fat content.", "watch": "Higher omega-6 content from grain finishing, skews the fat profile less favorably.", "origin": "Same domestication history, grain-finishing is a 20th century feedlot practice."}, {"name": "Lamb", "good": "Naturally higher omega-3 ratio than most beef since lamb is almost always grass-fed.", "watch": "Higher saturated fat content than beef by percentage.", "origin": "Fertile Crescent, domesticated alongside goats."}, {"name": "Bison", "good": "Leaner than beef with a similar or better omega-3 ratio, nearly always grass-fed.", "watch": "Very lean, easy to overcook and dry out.", "origin": "North America."}, {"name": "Pork", "good": "Good source of thiamine (B1), higher than most other red meats.", "watch": "Higher omega-6 content, especially in conventionally raised, grain-fed pigs.", "origin": "Domesticated from wild boar in both Anatolia and China independently."}, {"name": "Venison", "good": "Wild or pasture-raised by default, very lean, high B12, iron, and zinc with an excellent fat profile.", "watch": "Very lean, easy to overcook. Wild-harvested quality varies with the animal's diet.", "origin": "Deer, hunted by humans continuously since the Paleolithic."}]}, {"name": "Poultry", "children": [{"name": "Chicken", "good": "Lean complete protein, breast meat especially low in fat.", "watch": "Conventionally raised chicken has a notably higher omega-6 content than pasture-raised.", "origin": "Southeast Asia, domesticated from red junglefowl."}, {"name": "Turkey", "good": "Very lean, high protein, good B vitamins.", "watch": "Similar omega-6 concerns as conventional chicken if grain-fed.", "origin": "North America."}, {"name": "Duck", "good": "Higher fat content than chicken, better omega-3 ratio, rich in iron.", "watch": "Calorie dense. Fat is a mix of saturated and monounsaturated.", "origin": "East Asia, domesticated over 3,000 years ago."}]}, {"name": "Seafood", "children": [{"name": "Salmon", "good": "One of the best dietary sources of omega-3 (EPA/DHA), high vitamin D.", "watch": "Farmed salmon has a notably worse omega-3 to omega-6 ratio than wild-caught.", "origin": "North Atlantic and Pacific rivers, anadromous fish."}, {"name": "Sardines", "good": "Extremely high omega-3, calcium (from edible bones), and low mercury due to short lifespan.", "watch": "High purine content, a consideration for gout-prone individuals.", "origin": "Mediterranean and worldwide coastal waters."}, {"name": "Tuna", "good": "High protein and omega-3, particularly in fattier cuts.", "watch": "Larger tuna species accumulate significant mercury due to their position in the food chain.", "origin": "Worldwide temperate and tropical oceans."}, {"name": "Shrimp", "good": "Very high protein, low fat, good selenium and B12.", "watch": "High dietary cholesterol, though this has limited effect on blood cholesterol for most people.", "origin": "Worldwide coastal waters."}, {"name": "Mackerel", "good": "One of the highest omega-3 contents of any fish.", "watch": "King mackerel specifically has high mercury; smaller mackerel are safer.", "origin": "Worldwide temperate waters."}, {"name": "Cod", "good": "Very lean, high protein, mild flavor, low mercury.", "watch": "Low fat means lower omega-3 content than fattier fish.", "origin": "North Atlantic."}, {"name": "Oysters", "good": "Among the highest zinc content of any food, good B12 and copper.", "watch": "Filter feeders, can accumulate contaminants and bacteria if from polluted water.", "origin": "Worldwide coastal waters, cultivated for thousands of years."}, {"name": "Anchovies", "good": "Omega-3 density rivaling sardines, very low mercury due to tiny size and short life, high calcium with bones.", "watch": "Usually cured in salt, so sodium runs high in the jarred form.", "origin": "Mediterranean and worldwide coastal waters, salted since Roman times."}, {"name": "Trout", "good": "Farmed rainbow trout is one of the cleanest farmed fish, good omega-3, low mercury.", "watch": "Lower omega-3 than salmon or sardines, quality varies by farm.", "origin": "Northern hemisphere freshwater, farmed since the 1800s."}, {"name": "Mussels", "good": "High B12, iron, selenium, and omega-3 for their price. Among the most sustainable animal foods farmed.", "watch": "Filter feeders, so source water quality matters. Must be cooked live and fresh.", "origin": "Worldwide coastal waters, farmed since the 13th century in France."}]}, {"name": "Organ Meats", "children": [{"name": "Beef Liver", "good": "One of the most nutrient-dense foods on the planet, extremely high vitamin A, B12, copper, and folate.", "watch": "Very high vitamin A means it should not be eaten daily in large amounts, risk of toxicity.", "origin": "Byproduct of cattle domestication."}, {"name": "Beef Heart", "good": "High CoQ10 content, good protein and B vitamins, milder flavor than liver.", "watch": "Fairly high cholesterol content, minor concern for most people.", "origin": "Byproduct of cattle domestication."}, {"name": "Bone Marrow", "good": "Contains collagen-related compounds. Fat is largely monounsaturated.", "watch": "Very calorie and fat dense.", "origin": "Traditional food across nearly all cattle and game-hunting cultures."}, {"name": "Chicken Liver", "good": "Milder-flavored entry point to liver. Very high B12, folate, vitamin A, and iron, cheap in most grocery stores.", "watch": "Same vitamin A ceiling as beef liver, don't eat large amounts daily.", "origin": "Byproduct of chicken domestication."}]}]}, {"name": "Dairy", "color": "--dairy", "children": [{"name": "Whole Milk", "good": "Complete protein, calcium, and in the case of grass-fed cows, a better fat profile than skim.", "watch": "Lactose can cause digestive issues for the large percentage of adults with reduced lactase production.", "origin": "Domesticated from aurochs milking practices roughly 8,000 years ago in the Near East."}, {"name": "Cheese (aged/hard)", "good": "Concentrated protein and calcium, lower lactose than milk since most is removed during fermentation.", "watch": "High sodium and saturated fat, easy to overconsume calorically.", "origin": "Likely discovered accidentally via milk stored in animal-stomach containers, over 7,000 years ago."}, {"name": "Yogurt (full-fat)", "good": "Contains probiotics from live cultures, easier to digest than milk due to partial lactose breakdown.", "watch": "Flavored commercial versions are often loaded with added sugar.", "origin": "Central Asia and the Middle East."}, {"name": "Butter", "good": "High in fat-soluble vitamins A, D, E, K2 especially from grass-fed cows.", "watch": "Nearly pure saturated fat, calorie dense.", "origin": "Ancient nomadic cultures across Asia and Europe."}, {"name": "Cream", "good": "High fat, low lactose relative to milk, minimal protein or sugar.", "watch": "Extremely calorie dense.", "origin": "Byproduct of milk separation, used throughout dairying history."}, {"name": "Kefir", "good": "More probiotic strains than yogurt, often better tolerated by the lactose sensitive.", "watch": "Fermentation produces a small amount of alcohol, generally negligible.", "origin": "North Caucasus region."}, {"name": "Cottage Cheese", "good": "Very high protein per calorie, good source of casein (slow-digesting protein).", "watch": "High sodium in most commercial versions.", "origin": "Eastern Europe."}, {"name": "Greek Yogurt (full-fat)", "good": "Strained yogurt with roughly double the protein of regular yogurt and less lactose, plus live cultures.", "watch": "Flavored versions are sugar bombs; buy plain.", "origin": "Strained yogurt traditions across the Eastern Mediterranean and Middle East."}]}, {"name": "Other Animal Products", "color": "--other", "children": [{"name": "Eggs (whole)", "good": "Near-complete amino acid profile, choline for brain health, most nutrients concentrated in the yolk.", "watch": "Dietary cholesterol is present but has limited effect on blood cholesterol for the majority of people.", "origin": "Domesticated alongside chickens in Southeast Asia."}, {"name": "Honey", "good": "Contains trace enzymes, antioxidants, and antimicrobial compounds not found in refined sugar.", "watch": "Still mostly fructose and glucose; raises blood sugar similarly to table sugar.", "origin": "Harvested by humans for at least 8,000 years, evidenced in cave paintings."}, {"name": "Bone Broth", "good": "Source of collagen, glycine, and minerals leached from bones during long simmering.", "watch": "Nutrient content varies widely by preparation; often overstated in marketing.", "origin": "Traditional practice across nearly every meat-eating culture historically."}, {"name": "Fish Roe", "good": "Eggs are the most nutrient-dense part of any animal. Extremely high omega-3, B12, choline, and vitamin D.", "watch": "Expensive in caviar form; salmon roe and affordable jarred roe carry the same nutrition. High sodium as cured.", "origin": "Eaten by coastal cultures worldwide, prized from Scandinavia to Japan."}]}, {"name": "Fats & Oils", "color": "--fat", "children": [{"name": "Olive Oil", "good": "Contains polyphenol antioxidants, especially in extra virgin form. Fat is almost entirely unsaturated.", "watch": "Lower smoke point than refined oils, degrades faster with high heat.", "origin": "Eastern Mediterranean, cultivated for at least 6,000 years."}, {"name": "Tallow (beef fat)", "good": "Stable saturated fat, high smoke point, good for high-heat cooking.", "watch": "Very calorie dense, flavor is strongly beef-forward.", "origin": "Traditional rendered fat used throughout meat-eating history."}, {"name": "Ghee", "good": "Clarified butter with lactose and casein removed, very high smoke point.", "watch": "Still nearly pure saturated fat, calorie dense.", "origin": "Ancient India, developed partly to preserve butter in a hot climate."}, {"name": "Coconut Oil", "good": "High in medium-chain triglycerides, very stable at high heat.", "watch": "Almost entirely saturated fat, though a different type than animal fat.", "origin": "Indo-Pacific region."}, {"name": "Avocado Oil", "good": "Very high smoke point among natural oils. Fat is almost entirely unsaturated.", "watch": "Frequently adulterated or cut with cheaper oils in commercial products.", "origin": "Mexico and Central America."}, {"name": "Peanut Oil", "good": "Mostly monounsaturated fat, fairly stable for high-heat frying, lower saturated fat than commonly assumed.", "watch": "Still contains meaningful omega-6, and is a common allergen source.", "origin": "South America, though peanut oil extraction was industrialized in China and the US."}, {"name": "Canola Oil", "good": "Low saturated fat content, cheap and neutral flavored.", "watch": "Heavily refined using solvents and heat; high polyunsaturated content oxidizes readily when heated, forming harmful compounds.", "origin": "Bred in Canada in the 1970s from rapeseed to reduce toxic erucic acid content."}, {"name": "Lard (pork fat)", "good": "Roughly half monounsaturated fat, more than people assume, decent vitamin D if from pasture-raised pigs.", "watch": "Still calorie dense, quality varies enormously by how the pig was raised.", "origin": "Used throughout nearly all pork-eating cultures historically."}]}, {"name": "Fungi", "children": [{"name": "Button Mushroom", "good": "Good source of B vitamins, selenium, and the only significant plant-world vitamin D source (when sun-exposed).", "watch": "Contains small amounts of agaritine, a naturally occurring compound reduced by cooking.", "origin": "Cultivated in France in the 1600s, wild ancestors worldwide."}, {"name": "Shiitake", "good": "Higher B vitamins and immune-supporting polysaccharides than button mushrooms.", "watch": "Raw shiitake can cause a skin reaction (shiitake dermatitis) in some people; always cook.", "origin": "East Asia, cultivated for over 1,000 years."}, {"name": "Portobello", "good": "Mature cremini/button mushroom, meaty texture, good potassium.", "watch": "Same minor agaritine content as button mushrooms.", "origin": "Same species as button mushroom, aged longer."}, {"name": "Oyster Mushroom", "good": "Good B vitamins and ergothioneine, an antioxidant amino acid mushrooms are uniquely rich in. Contains natural lovastatin-like compounds.", "watch": "Always cook; raw mushrooms are poorly digestible.", "origin": "Grows on dead hardwood worldwide, first cultivated in Germany during WWI."}], "color": "--fungi"}]};
const FLAG_INFO = {"High omega-6":{"what":"Heavy in omega-6 polyunsaturated fat. Ancestrally humans got roughly 1 to 2 percent of calories from PUFA; the modern diet runs closer to 15 to 20 percent, and foods like this are a big reason why. A high absolute omega-6 intake, on its own and regardless of the omega-3 ratio, promotes inflammation and oxidizes easily in the body.","fix":"Treat it as occasional rather than a staple, and lean on ancestral fats instead: butter, ghee, tallow, coconut, olive oil (moderate, but far better than seed oils), fatty fish, and grass-fed meat. For nuts, macadamia is the low omega-6 pick."},"Elevated omega-6":{"what":"Moderately high in omega-6 PUFA. Not extreme, but by ancestral standards (1 to 2 percent of calories from PUFA versus today's 15 to 20 percent), even an amount that is average for a modern food is already elevated. Flagged so it stays visible if you are deliberately keeping PUFA low.","fix":"Fine in normal amounts. Just don't let it stack up across the day on top of other omega-6 sources, and favor monounsaturated and saturated fats where you have the choice."},"Phytates":{"what":"Phytic acid binds zinc, iron, calcium and magnesium in the gut and lowers how much you absorb. It's the seed's way of guarding its minerals until it's ready to sprout.","fix":"Soak, sprout, ferment, or roast to cut phytate sharply. Pairing with a vitamin C rich food boosts iron absorption, and eating meat provides highly absorbable minerals phytate can't touch."},"Lectins":{"what":"Defensive proteins that irritate the gut lining and are genuinely toxic when the food is raw or undercooked (raw kidney beans are the classic danger).","fix":"Cook thoroughly. Boiling or pressure cooking destroys nearly all of it. Never eat these raw or undercooked."},"Oxalates":{"what":"Bind calcium and can contribute to kidney stones in people prone to them. Mostly a concern if the food is eaten in large volumes every day.","fix":"Boil and discard the water to lower oxalate, and pair with a calcium source so it binds in the gut instead of your kidneys. Stay well hydrated."},"Goitrogens":{"what":"Can interfere with iodine uptake and thyroid function when eaten raw in large amounts.","fix":"Cooking deactivates most goitrogens. Adequate iodine (seafood, eggs, dairy, iodized salt) fully offsets the effect for most people."},"Glycoalkaloids":{"what":"Nightshade alkaloids such as solanine, concentrated in green, sprouted, or damaged parts. Mildly irritating for sensitive people; normal ripe portions are fine for most.","fix":"Avoid green, sprouted, or damaged parts, peel where relevant, and don't eat raw in bulk. Ripe, properly stored produce is low risk."},"Cyanogenic":{"what":"Contains compounds that release cyanide if eaten raw or in quantity (this is why cassava must be processed and why fruit pits shouldn't be eaten).","fix":"Proper cooking, soaking, or processing removes it entirely. Never eat the raw form, or the seeds, kernels, and pits."},"High mercury":{"what":"Sits high on the food chain and accumulates mercury. Fine occasionally, but worth limiting frequency, especially during pregnancy.","fix":"Choose smaller, younger fish more often (sardines, cod), and keep big predators to occasional. Especially important in pregnancy."},"High sugar":{"what":"High in natural sugar, so it raises blood sugar faster than most whole foods. In whole form the fiber blunts this, so it's a portion and context issue, not a reason to avoid.","fix":"Eat it whole so the fiber slows absorption, keep portions sane, and pair with protein or fat to flatten the blood sugar rise."},"Aflatoxin risk":{"what":"Can grow a mold-produced toxin if stored warm or damp. Fresh, properly stored product avoids it.","fix":"Buy fresh from high-turnover sources and store cool and dry. Discard anything that smells musty or looks moldy."},"Vitamin A excess":{"what":"So dense in vitamin A that frequent large servings can build up to toxic levels over time.","fix":"Space it out rather than eating it daily. A serving every week or two captures the benefit without buildup."},"Selenium excess":{"what":"So dense in selenium that eating several per day can overshoot the safe upper limit.","fix":"Cap it at one or two per day. That covers your full selenium need without overshooting."},"Phytoestrogens":{"what":"Plant compounds that mimic estrogen in the body. The real-world effect in humans is debated rather than clearly harmful.","fix":"Keep intake moderate rather than making it a primary protein source. Whole and fermented forms are the least concerning."},"Lactose":{"what":"Milk sugar that a large share of adults digest poorly, causing bloating or discomfort.","fix":"Choose aged cheese, butter, or fermented dairy (yogurt, kefir), which have little to no lactose, or use lactase drops."},"High FODMAP":{"what":"Fermentable fibers that trigger gas and bloating in sensitive guts. Not harmful, just uncomfortable for some.","fix":"Cooking and smaller portions help. Green scallion tops and garlic-infused (not chopped) oil give the flavor with far less FODMAP."},"Drug interaction":{"what":"Alters how the liver processes a long list of medications, which can raise or lower their effective dose.","fix":"If you take regular medication, check with a pharmacist before eating this often. Separating the timing does not reliably fix it."},"Allergen":{"what":"One of the more common serious food allergens.","fix":"Only a concern if you're allergic. If you are, strict avoidance is the only reliable approach."},"Acidic":{"what":"Acidic enough to erode tooth enamel with very frequent direct contact.","fix":"Rinse with water afterward and don't brush immediately. Using a straw for juices limits contact with your teeth."},"Charring risk":{"what":"Cooking to char or well-done forms carcinogenic compounds (HCAs and PAHs). This is about the cooking method, not the meat itself.","fix":"Cook gentler, avoid blackening, flip often, and trim burnt bits. Marinating before high heat measurably lowers the compounds formed."},"Toxic parts":{"what":"A part of the plant other than the part normally eaten is toxic (leaves, skin, sprouts, or stems depending on the food).","fix":"Just eat the part meant to be eaten and discard the rest. The edible portion is completely safe."},"Arsenic":{"what":"The bran can accumulate arsenic from soil and water, which is why brown rice carries more than white.","fix":"Rinse well before cooking and cook in extra water like pasta, then drain. This cuts arsenic notably."},"High sodium":{"what":"High in salt as normally prepared. Only a real issue for salt-sensitive or blood-pressure conditions if you hydrate normally.","fix":"Balance with potassium-rich whole foods and stay hydrated. Rinsing (for some foods) and portion control help too."},"Purity varies":{"what":"Frequently adulterated or cut with cheaper oils in commercial products, so what's on the label isn't always what's inside.","fix":"Buy single-origin or reputable brands, ideally third-party tested, to avoid oils cut with cheap filler."},"Oxidation prone":{"what":"The polyunsaturated fat oxidizes readily when heated, forming harmful compounds. A poor choice for high-heat cooking.","fix":"Don't use for high-heat cooking. If used at all, keep it cold (dressings) and store it dark, sealed, and cool."},"Trace alcohol":{"what":"Fermentation produces a small amount of alcohol, generally negligible.","fix":"Negligible for nearly everyone. Only relevant if you avoid alcohol entirely for medical or personal reasons."},"Purines":{"what":"High in purines, which the body converts to uric acid. A consideration mainly for people prone to gout.","fix":"Only relevant if you're gout-prone. If so, keep portions modest and stay well hydrated."}};

const svg = d3.select("#chart");
const wrap = document.getElementById("canvasWrap");
let width = wrap.clientWidth, height = wrap.clientHeight;

function colorFor(d){
  let n = d; while(n && !n.data.color) n = n.parent;
  const varName = n ? n.data.color : "--ink-soft";
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

const baseHierarchy = d3.hierarchy(DATA).sum(d=>d.children?0:1).sort((a,b)=>b.value-a.value);
const pack = () => d3.pack().size([width-4,height-4]).padding(3)(baseHierarchy);
function ringLayout(rt){
  rt.descendants().forEach(p=>{
    if(p.children && p.children.every(ch=>!ch.children)){
      const n=p.children.length, R=p.r*0.97;
      let r, pos=[];
      if(n===1){ r=R; pos=[[0,0]]; }
      else if(n<=6){
        const s=Math.sin(Math.PI/n); r=R*s/(1+s); const ring=R-r;
        for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n; pos.push([ring*Math.cos(a),ring*Math.sin(a)]);}
      } else {
        const m=n-1, s=Math.sin(Math.PI/m); r=R*s/(1+s); const ring=R-r;
        pos.push([0,0]);
        for(let i=0;i<m;i++){const a=-Math.PI/2+i*2*Math.PI/m; pos.push([ring*Math.cos(a),ring*Math.sin(a)]);}
      }
      const gap=0.985;
      const score = ch => {
        if(ch.children){ const ls=ch.leaves(); return ls.reduce((a,x)=>a+(SCORES[x.data.name]||0),0)/ls.length; }
        return SCORES[ch.data.name]||0;
      };
      if(n>6){
        const ringIdx = pos.map((q,i)=>i).slice(1).sort((a,b)=>pos[a][1]-pos[b][1]);
        const rest = p.children.slice(1).sort((a,b)=>score(a)-score(b));
        p.children[0].x=p.x; p.children[0].y=p.y; p.children[0].r=(R-2*r)*gap;
        rest.forEach((ch,j)=>{ const pi=ringIdx[j]; ch.r=r*gap; ch.x=p.x+pos[pi][0]; ch.y=p.y+pos[pi][1]; });
      } else {
        const order = pos.map((q,i)=>i).sort((a,b)=>pos[a][1]-pos[b][1]);
        const kids = p.children.slice().sort((a,b)=>score(a)-score(b));
        kids.forEach((ch,j)=>{ const pi=order[j]; ch.r=r*gap; ch.x=p.x+pos[pi][0]; ch.y=p.y+pos[pi][1]; });
      }
    }
  });
  return rt;
}
function sortSiblingsByScore(rt){
  const score = ch => { const ls=ch.leaves(); return ls.reduce((a,x)=>a+(SCORES[x.data.name]||0),0)/ls.length; };
  rt.descendants().forEach(p=>{
    if(!p.children || !p.children.some(ch=>ch.children)) return;
    const groups = {};
    p.children.forEach(ch=>{ const key=Math.round(ch.r*10); (groups[key]=groups[key]||[]).push(ch); });
    Object.values(groups).forEach(gr=>{
      if(gr.length<2) return;
      const slots = gr.map(ch=>({x:ch.x,y:ch.y})).sort((a,b)=>a.y-b.y);
      gr.slice().sort((a,b)=>score(a)-score(b)).forEach((ch,i)=>{
        const dx=slots[i].x-ch.x, dy=slots[i].y-ch.y;
        ch.descendants().forEach(nd=>{ nd.x+=dx; nd.y+=dy; });
      });
    });
  });
  return rt;
}

const defs = svg.append("defs");
const glossG = defs.append("radialGradient").attr("id","glossGrad").attr("cx","32%").attr("cy","26%").attr("r","70%");
glossG.append("stop").attr("offset","0%").attr("stop-color","#fff").attr("stop-opacity",0.42);

glossG.append("stop").attr("offset","72%").attr("stop-color","#fff").attr("stop-opacity",0);
root.descendants().slice(1).forEach((d,i)=>{
  d.gradId = "lg"+i;
  const base = d3.hsl(colorFor(d));
  let fillC;
  if(d.depth===1){
    const ls = d.leaves();
    const avg = ls.reduce((a,x)=>a+(SCORES[x.data.name]||0),0)/ls.length;
    d.levelP = 1 - avg/100;
    fillC = d3.hsl(base.h, base.s, base.l);
  } else if(d.children){
    const ls = d.leaves();
    const avg = ls.reduce((a,x)=>a+(SCORES[x.data.name]||0),0)/ls.length;
    d.levelP = 1 - avg/100;
    fillC = d3.hsl(base.h, base.s, Math.min(0.84, base.l+0.09));
  } else {
    d.levelP = 1 - (SCORES[d.data.name]||0)/100;
    fillC = d3.hsl(base.h, base.s, Math.min(0.75, base.l+0.14));
  }
  d.fillSolid = fillC.formatHex();
  const gr = defs.append("linearGradient").attr("id",d.gradId)
    .attr("x1",0).attr("y1",0).attr("x2",0).attr("y2",1);
  gr.append("stop").attr("offset",0).attr("stop-color","#fff").attr("stop-opacity",0.82);
  gr.append("stop").attr("offset",0).attr("stop-color","#fff").attr("stop-opacity",0);

const node = g.selectAll("circle").data(root.descendants().slice(1)).join("circle")
  .attr("fill", d=> d.fillSolid || groupFill(d))
  .attr("fill-opacity", d=>d.children?0.9:1)
  .attr("stroke","rgba(255,255,255,0.55)").attr("stroke-width",1)
  .on("click",(event,d)=>{
    event.stopPropagation();
    if(d.children){ if(focus!==d){ zoom(event,d); } else if(d.parent){ zoom(event,d.parent); } }
    else { openSheet(d); }
  });

const labelGroup = g.selectAll("g.labelG").data(root.descendants().slice(1)).join("g")
  .attr("class","labelG").style("pointer-events","none");
labelGroup.each(function(d){
  const t = d3.select(this).append("text").attr("class","label")
    .style("font-size", ()=> d.depth===1?"14px":d.depth===2?"12px":"10.5px");
  const words = d.data.name.split(" ");
  const lines = [];
  let cur = "";
  words.forEach(w=>{
    if(cur && (cur+" "+w).length>10){ lines.push(cur); cur=w; } else { cur = cur?cur+" "+w:w; }
  });
  if(cur) lines.push(cur);
  d.labelChars = Math.max(...lines.map(l=>l.length));
  d.labelLines = lines.length;
  lines.forEach(ln=>{
    t.append("tspan").attr("x",0).attr("dy",0).text(ln);
  });
});

const gloss = g.selectAll("circle.gloss").data(root.descendants().slice(1).filter(d=>!d.children)).join("circle")
  .attr("class","gloss").attr("fill","url(#glossGrad)").style("pointer-events","none");

const wash = g.selectAll("circle.wash").data(root.descendants().slice(1)).join("circle")
  .attr("class","wash").attr("fill", d=>"url(#"+d.gradId+")").style("pointer-events","none");

const underGloss = [];
node.each(function(d){
  if(d.depth===1){
    const el = document.createElementNS("http://www.w3.org/2000/svg","circle");
    el.setAttribute("fill","url(#glossGrad)");
    el.style.pointerEvents = "none";
    this.parentNode.insertBefore(el, this.nextSibling);
    underGloss.push({el, d});
  }
});
labelGroup.raise();

svg.on("click",(event)=>{ if(focus.parent) zoom(event,focus.parent); });
function targetView(d){
  if(d.children && d.children.length){
    const e = d3.packEnclose(d.children.map(ch=>({x:ch.x,y:ch.y,r:ch.r})));
    return [e.x,e.y,e.r*2.12];
  }
  return [d.x,d.y,d.r*2.15];
}
zoomTo(targetView(root));
applyFills();

function zoomTo(v){
  const k = Math.min(width,height)/v[2]; view=v;
  labelGroup.attr("transform",d=>`translate(${(d.x-v[0])*k+width/2},${(d.y-v[1])*k+height/2})`);
  node.attr("transform",d=>`translate(${(d.x-v[0])*k+width/2},${(d.y-v[1])*k+height/2})`);
  node.attr("r",d=>d.r*k);
  gloss.attr("transform",d=>`translate(${(d.x-v[0])*k+width/2},${(d.y-v[1])*k+height/2})`).attr("r",d=>d.r*k);
  wash.attr("transform",d=>`translate(${(d.x-v[0])*k+width/2},${(d.y-v[1])*k+height/2})`).attr("r",d=>d.r*k);
  underGloss.forEach(o=>{
    o.el.setAttribute("transform",`translate(${(o.d.x-v[0])*k+width/2},${(o.d.y-v[1])*k+height/2})`);
    o.el.setAttribute("r", o.d.r*k);
  });
  node.style("pointer-events",d=> d.parent===focus ? "auto":"none");
  labelGroup.selectAll("text")
    .style("display",d=> (d.parent===focus && d.r*k>14) ? null : "none")
    .each(function(d){
      const rk = d.r*k;
      const byWidth = (1.7*rk)/(d.labelChars*0.62);
      const byHeight = (1.5*rk)/(d.labelLines*1.15);
      const fs = Math.max(10, Math.min(byWidth, byHeight, rk*0.5));
      this.style.fontSize = fs+"px";
      d3.select(this).selectAll("tspan")
        .attr("dy",(dd,i)=> i===0 ? (0.32-(d.labelLines-1)*0.55)*fs : 1.1*fs);
    });
}
function groupFill(d){
  const base=d3.hsl(colorFor(d)); if(isNaN(base.l)) return "#ccc";
  return base.formatHex();
}
function applyFills(){
  root.descendants().slice(1).forEach(d=>{
    if(!d.gradId) return;
    const target = (d.parent===focus) ? d.levelP : 0;
    d3.select("#"+d.gradId).selectAll("stop").transition().duration(750).attr("offset", target);
  });
}
function zoom(event,d){
  focus=d; updateBreadcrumb(); applyFills();
  svg.transition().duration(650).tween("zoom",()=>{
    const i=d3.interpolateZoom(view,targetView(focus));
    return t=>zoomTo(i(t));
  });
}
const DEFS = {"Whole Foods": "Unprocessed or minimally processed foods in their natural form.", "Vegetables": "Edible non-fruit parts of plants: roots, stems, leaves, bulbs, flower heads.", "Root Vegetables": "The plant's underground energy store: taproots and tubers. Typically starch-dense.", "Leafy Greens": "Leaves eaten as food. Low calorie; many carry oxalates or goitrogens.", "Cruciferous": "Brassica flower heads and stems. All contain goitrogens.", "Alliums": "The onion family. Sulfur compounds, no notable antinutrients.", "Nightshades": "Solanaceae family. Contain alkaloids such as solanine, plus lectins.", "Squash & Gourds": "Fruits of vining plants eaten as vegetables. Mild, watery, low antinutrient.", "Stalks & Stems": "Edible plant stalks. Mostly water and fiber.", "Fungi": "Mushrooms. Their own kingdom, not plants, so no plant antinutrients. Unique compounds like ergothioneine.", "Fruits": "Seed-bearing structures of flowering plants, eaten ripe.", "Berries": "Small dark polyphenol-dense fruits. Grouped by nutritional behavior, not botany.", "Citrus": "Acidic fruits of the Citrus genus. Defined by vitamin C.", "Pomes": "Core-and-seed fruits of the apple family.", "Stone Fruits": "Single-pit fruits of the Prunus genus.", "Tropical Fruits": "Fruits of tropical climates. Generally higher sugar.", "Melons": "Large watery gourd-family fruits. Mostly glucose and water.", "Other Fruits": "Fruits that fit no other group cleanly.", "Legumes": "Seeds that grow in pods. Highest lectin and phytate load of any plant group.", "Grains": "Grass seeds. Starch-dense, with gluten, phytate, and omega-6 skew.", "Nuts & Seeds": "Tree nuts and oil seeds. Calorie dense, phytate and omega-6 heavy.", "Meat": "Animal flesh. Complete protein, B12, heme iron, zero antinutrients.", "Red Meat": "Mammal muscle meat. Ruminants (beef, lamb, bison) carry the best fat profile.", "Poultry": "Bird meat. Leaner, but grain feeding skews it omega-6.", "Seafood": "Fish and shellfish. The main whole-food source of EPA and DHA omega-3.", "Organ Meats": "Organs and marrow. The most nutrient-dense foods per gram that exist.", "Dairy": "Milk and foods made from it. Fermentation removes most of its downsides.", "Other Animal Products": "Animal foods that are not flesh or dairy.", "Fats & Oils": "Isolated fats. Judged on saturation and processing."};
function updateBreadcrumb(){
  document.getElementById("catNote").textContent = DEFS[focus.data.name] || "";
  const chain=[]; let n=focus; while(n){chain.unshift(n);n=n.parent;}
  const el=document.getElementById("breadcrumb"); el.innerHTML="";
  chain.forEach((n,i)=>{
    if(i>0){const sep=document.createElement("span");sep.className="sep";sep.textContent="›";el.appendChild(sep);}
    const s=document.createElement("span"); s.textContent=n.data.name;
    if(n===focus) s.classList.add("current"); else s.addEventListener("click",()=>zoom(null,n));
    el.appendChild(s);
  });
}
updateBreadcrumb();

window.addEventListener("resize",()=>{
  width=wrap.clientWidth; height=wrap.clientHeight;
  svg.attr("viewBox",`-2 -2 ${width} ${height}`).attr("width",width).attr("height",height);
  sortSiblingsByScore(ringLayout(pack())); zoomTo(targetView(focus));
});

/* ---------- score helpers ---------- */
function scoreColor(s){
  if(s>=85) return "#2f7d4f";
  if(s>=70) return "#5a9c4e";
  if(s>=55) return "#9aa63c";
  if(s>=40) return "#c98a2e";
  if(s>=25) return "#c05f2c";
  return "#b23b2e";
}
function scoreVerdict(s){
  if(s>=85) return "Eat freely, even daily.";
  if(s>=70) return "Great regular food, minor caveats.";
  if(s>=55) return "Solid, but mind the caveats or prep.";
  if(s>=40) return "Fine sometimes, not a daily staple.";
  if(s>=25) return "Occasional at most, real downsides.";
  return "Minimize. Better options exist.";
}
function factorDot(label,val){
  const good="#3f6b4c", mid="#c98a2e", bad="#b23b2e", neutral="#9a9384";
  let c=neutral;
  if(label==="Nutrient density"){ c = val==="High"?good:val==="Moderate"?mid:neutral; }
  else if(label==="Omega-6 load"){ c = val==="Low"?good:val==="Moderate"?mid:bad; }
  else if(label==="Sugar"){ c = (val==="Low"||val==="None")?good:val==="Moderate"?mid:bad; }
  else if(label==="Antinutrients"){ c = val==="None"?good:val==="Low"?good:val==="Moderate"?mid:bad; }
  else if(label==="Processing"){ c = val==="Whole / unprocessed"?good:val==="Minimally processed"?mid:bad; }
  return c;
}

/* ---------- bottom sheet ---------- */
const sheet=document.getElementById("sheet");
const overlay=document.getElementById("overlay");
const sheetInner=document.getElementById("sheetInner");
function eyebrowColor(d){ let n=d; while(n&&!n.data.color)n=n.parent; return n?n.data.color:"--ink-soft"; }

function openSheet(d){
  const name=d.data.name;
  const catVar=eyebrowColor(d);
  const catName=(()=>{ let n=d.parent; while(n&&n.parent&&n.parent.parent)n=n.parent; return n?n.data.name:""; })();
  const score = SCORES[name];
  const flags = FLAGS[name]||[];
  const factors = FACTOR_LABELS[name]||{};

  const meterHtml = (score==null)?"":`
    <div class="score-wrap">
      <div class="score-top">
        <span class="score-cap">Daily-eating score</span>
        <span class="score-num" style="color:${scoreColor(score)}">${score}<span style="font-size:13px;color:var(--ink-soft)">/100</span></span>
      </div>
      <div class="meter"><div class="meter-marker" style="left:${score}%"></div></div>
      <div class="score-legend"><span>0 · minimize</span><span>100 · eat freely</span></div>
      <div class="score-note"><b>${scoreVerdict(score)}</b> Score reflects nutrient density, fat composition (saturated as the standard), sugar in whole-food context, antinutrient load, and processing.</div>
    </div>`;

  let chipsHtml='<div class="chips">';
  Object.entries(factors).forEach(([k,v])=>{
    chipsHtml += `<span class="chip"><span class="dot" style="background:${factorDot(k,v)}"></span><b>${k}:</b> ${v}</span>`;
  });
  chipsHtml += '</div>';

  let flagRowHtml;
  if(flags.length===0){
    flagRowHtml='<div id="flagRow"><span class="flag-pill clean">No notable flags</span></div>';
  } else {
    flagRowHtml='<div id="flagRow">'+flags.map(f=>`<span class="flag-pill" data-flag="${f.replace(/"/g,'&quot;')}">${f}</span>`).join('')+'</div>';
  }

  sheetInner.innerHTML=`
    <div class="sheet-eyebrow" style="color:var(${catVar})">${catName}</div>
    <h2>${name}</h2>
    <div class="origin">${d.data.origin||""}</div>
    ${meterHtml}
    ${chipsHtml}
    ${flagRowHtml}
    <div id="flagWhy"></div>
    <div class="block"><div class="block-label good">Upside</div><p>${d.data.good||"—"}</p></div>
    <div class="block"><div class="block-label watch">Downside</div><p>${d.data.watch||"—"}</p></div>
  `;

  const whyBox=sheetInner.querySelector('#flagWhy');
  let active=null;
  sheetInner.querySelectorAll('.flag-pill[data-flag]').forEach(pill=>{
    pill.addEventListener('click',()=>{
      const f=pill.getAttribute('data-flag');
      const pills=sheetInner.querySelectorAll('.flag-pill[data-flag]');
      if(active===f){ active=null; pills.forEach(p=>p.classList.remove('on')); whyBox.classList.remove('open'); return; }
      active=f; pills.forEach(p=>p.classList.toggle('on',p.getAttribute('data-flag')===f));
      const info=FLAG_INFO[f]||{what:"",fix:""};
      whyBox.innerHTML='<div class="why-label">What '+f+' means</div><p>'+info.what+'</p>'+
                       '<div class="fix-label">How to reduce it</div><p>'+info.fix+'</p>';
      whyBox.classList.add('open');
    });
  });

  sheet.classList.add("open"); overlay.classList.add("open");
}
function closeSheet(){ sheet.classList.remove("open"); overlay.classList.remove("open"); }
document.getElementById("sheetClose").addEventListener("click",closeSheet);
overlay.addEventListener("click",closeSheet);
</script>
